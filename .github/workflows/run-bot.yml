name: SK22-Auto-Run

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ติดตั้งไลบรารีพื้นฐานก่อน
          pip install ccxt requests pandas numpy
          # ใช้คำสั่งนี้เพื่อบังคับติดตั้ง pandas-ta จาก GitHub โดยระบุโปรโตคอลให้ชัดเจน
          # หากยังไม่ได้ จะใช้เวอร์ชันสำรองที่ติดตั้งง่ายกว่า
          pip install git+https://github.com/twopirllc/pandas-ta.git@main || pip install pandas-ta==0.3.14b0 --no-dependencies
