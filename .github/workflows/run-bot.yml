name: SK22-5min-Run

on:
  schedule:
    # แก้ไข: เปลี่ยนจาก */15 เป็น */5 เพื่อรันทุกๆ 5 นาที (นาทีที่ 0, 5, 10, 15, ..., 55)
    # ตั้งแต่ 00:00 - 16:55 UTC (ประมาณ 07:00 - 23:55 เวลาไทย)
    - cron: '*/5 0-16 * * *'
  workflow_dispatch: # ปุ่มกดรันเองได้เหมือนเดิม

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: python bot.py
