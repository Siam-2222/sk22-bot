name: SK22-Auto-Run

on:
  schedule:
    # รันทุก 15 นาที เฉพาะเวลา 07:00 - 23:45 น. (เวลาไทย)
    # พักนอนตอน 00:00 - 06:45 น.
    - cron: '0,15,30,45 0-16 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # --- ผมเพิ่ม pytz ให้แล้วครับพี่ อะไหล่ครบแน่นอน ---
          pip install ccxt requests pandas numpy pytz

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          # --- ถ้าพี่มี API ของ OKX อย่าลืมใส่เพิ่มตรงนี้ด้วยนะพี่ ---
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: python bot.py
