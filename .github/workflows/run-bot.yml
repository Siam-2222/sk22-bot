name: SK22-Auto-Run

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ติดตั้งแบบไม่ระบุเวอร์ชันเพื่อให้ระบบหาตัวที่เข้ากันได้เอง
          pip install ccxt requests pandas pandas-ta numpy
