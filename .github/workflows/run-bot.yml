name: SK22-Auto-Run

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4   # อัปเดตเป็น v4 ดีกว่า

      - name: Set up Python
        uses: actions/setup-python@v5   # อัปเดตเป็น v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ccxt requests pandas==1.5.3 numpy==1.23.5
          # ใช้เวอร์ชันที่ stable + compatible มากที่สุดสำหรับ pandas-ta
          pip install pandas-ta==0.3.14b0
          # หรือถ้ายัง error ลองอันนี้ pip install git+https://github.com/twopirllc/pandas-ta.git@0.3.14b0

      - name: Run SK22 Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
